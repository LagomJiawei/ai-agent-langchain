[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-langchain"
version = "1.0.0"
description = "AI Agent based on LangChain + LangGraph - LiCaiManus"
authors = [
  { name="ZhangJw", email="zhangjw@example.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain>=1.3,<1.4",
  "langchain-core>=1.4,<1.5",
  "langchain-openai>=1.2,<1.3",
  "langchain-community>=0.4,<0.5",
  "langchain-milvus>=0.3,<0.4",
  "pymilvus>=2.6,<3.0",
  "faiss-cpu>=1.13,<1.14",
  "redis>=7.4,<7.5",
  "fastapi>=0.136,<0.137",
  "uvicorn>=0.47,<0.48",
  "sse-starlette>=3.4,<3.5",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.14,<2.15",
  "python-dotenv>=1.2,<2.0",
  "pypdf>=6.11,<7.0",
  "beautifulsoup4>=4.14,<5.0",
  "requests>=2.34,<3.0",
  "tenacity>=9.1,<10.0",
  "python-dateutil>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "loguru>=0.7,<0.8",
  "reportlab>=4.5,<5.0",
  "tiktoken>=0.13,<0.14",
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=1.3,<1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 120
target-version = ["py312"]
